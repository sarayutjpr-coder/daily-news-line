name: Send Daily Briefing Email
on:
  push:
    paths:
      - 'briefings/**.md'
jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send email via Resend
        run: python3 .github/scripts/send_email.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
