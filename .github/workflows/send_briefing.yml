name: Send Daily Briefing Email
on:
  push:
    paths:
      - 'briefings/**.md'
jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send email via Resend
        run: |
          FILE=$(ls briefings/*.md | sort | tail -1)
          DATE=$(echo $FILE | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}')
          CONTENT=$(cat "$FILE" | head -80 | tr -d '"' | tr -d '\r' | tr '\n' ' ')
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"onboarding@resend.dev\",\"to\":[\"sarayut.jpr@gmail.com\"],\"subject\":\"Daily Briefing $DATE\",\"text\":\"$CONTENT\"}"
          echo "Email sent"
